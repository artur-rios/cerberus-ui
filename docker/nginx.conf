# Serves the Flutter web build (IR-22). Installed as
# /etc/nginx/conf.d/default.conf in nginxinc/nginx-unprivileged, whose
# nginx.conf supplies the http block and runs as a non-root user.
#
# TLS is terminated by Traefik in front of this container (Operations &
# Infrastructure §6.3), so this server speaks plain HTTP on 8080 and leaves
# HSTS to the proxy.

server {
    listen      8080;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    server_tokens      off;
    # Redirects must stay relative: the client reached us over HTTPS on 443
    # through Traefik, not on http://<host>:8080.
    absolute_redirect  off;

    # .mjs is not in the image's mime.types. A `types` block replaces the
    # inherited map outright, so the stock map is re-included first.
    include /etc/nginx/mime.types;
    types {
        text/javascript mjs;
    }

    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json application/manifest+json application/wasm
                      image/svg+xml font/ttf font/otf application/x-font-ttf;

    # Liveness probe for the Docker HEALTHCHECK, not logged.
    location = /healthz {
        access_log   off;
        default_type text/plain;
        add_header   Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    # No service worker is ever served (IR-18). The image removes the file
    # Flutter emits; this keeps a stale browser from finding one either.
    location = /flutter_service_worker.js {
        return 404;
    }

    # Flutter emits un-hashed file names, so nothing can be cached as
    # immutable: every response is `no-cache` and revalidated by ETag.
    #
    # Deep links: any path that is not a file serves index.html, and the
    # application's router — and its single guard — decides what to show.
    #
    # add_header is not inherited into a location that declares its own, so
    # the security headers live in the same block as Cache-Control.
    location / {
        try_files $uri $uri/ /index.html;

        add_header Cache-Control          "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "no-referrer" always;
        add_header X-Frame-Options        "DENY" always;
        add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    }
}
