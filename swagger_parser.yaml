# IR-10: the API client is generated from the contract the API publishes, and
# committed unmodified. `api/cerberus.json` is copied from cerberus-api
# (`docs/contracts/openapi.json`), where that project's own build produces it.
# It is never authored here, and replacing it is the deliberate act of taking a
# new API contract, done in the change that needs it.
#
# Regenerate with:
#   dart run tool/generate_api_client.dart
#
# Everything under packages/cerberus_api_client/lib is generated and is never
# hand-edited (FR-DA-02). The package's own pubspec.yaml is maintained by hand.
# Ergonomic wrappers belong in the consuming feature's data/ layer.
#
# swagger_parser 2 always emits one folder per tag with its client, an `Api`
# entry class and a single `exports.dart`, which consumers import.

swagger_parser:
  schema_path: api/cerberus.json
  output_directory: packages/cerberus_api_client/lib

  generation:
    # Retrofit clients over the configured `dio`, with json_serializable DTOs.
    http_client: retrofit
    serializer: json_serializable

    # The decoded payload, not the transport response.
    original_http_response: false

    # The contract is strict both ways (UC-03 AF-06): every schema the API
    # publishes except ProblemDetails forbids additional properties, so a
    # response carrying a field the client does not know fails to decode and
    # is reported as an answer Cerberus could not read; the client is never
    # hand-edited to accommodate it. ProblemDetails, the body of a 415, allows
    # extension members, which its model keeps in additionalProperties; the
    # app does not decode it. An enum value the client does not know still
    # decodes, to the enum's Unknown case, rather than failing the whole
    # response.
    unknown_enum_values: preserve
