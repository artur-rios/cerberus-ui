# drift's code generation for the local store (IR-08, Operations &
# Infrastructure §2.4). Regenerate with:
#
#   dart run build_runner build --delete-conflicting-outputs
#
# A schema change also bumps schemaVersion, snapshots the new schema and
# regenerates the migration test helpers:
#
#   dart run drift_dev make-migrations
#   dart run drift_dev schema generate drift_schemas/local_store/ test/core/local_store/generated/
targets:
  $default:
    builders:
      drift_dev:
        options:
          databases:
            local_store: lib/core/local_store/local_store.dart
          schema_dir: drift_schemas/
          store_date_time_values_as_text: true
