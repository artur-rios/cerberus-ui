# The generated Cerberus API client.
#
# Everything under lib/ is generated by `dart run tool/generate_api_client.dart`
# and is never hand-edited (IR-10, FR-DA-02). THIS FILE is the exception: it is
# maintained by hand, because the generator does not produce it.

name: cerberus_api_client
description: Generated DTOs and clients for the Cerberus API. Do not hand-edit lib/.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.13.0

dependencies:
  dio: ^5.11.1
  json_annotation: ^4.12.0
  retrofit: ^4.10.0

dev_dependencies:
  build_runner: ^2.16.2
  json_serializable: ^6.14.1
  retrofit_generator: ^10.2.11
